[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceharbor"
version = "0.1.0"
description = "Local-first evidence and public-source investigation workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TraceHarbor contributors"}]
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[project.optional-dependencies]
images = ["Pillow>=12.3.0,<13"]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.7"]

[project.scripts]
traceharbor = "traceharbor.cli:main"

[tool.setuptools.package-data]
traceharbor = ["web/*"]

[tool.setuptools.packages.find]
include = ["traceharbor*"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
