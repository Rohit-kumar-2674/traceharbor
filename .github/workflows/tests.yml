name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install tested runtime and development tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check traceharbor tests
          ruff format --check traceharbor tests
      - name: Test core and API
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: node --check traceharbor/web/app.js
      - name: Build distributable packages
        run: |
          python -m pip install build
          python -m build
